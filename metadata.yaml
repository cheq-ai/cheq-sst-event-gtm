    changeNotes: |-
      Add "Send immediately" option to bypass event batching per event.
      Fail the tag (gtmOnFailure) when the event name resolves empty at runtime, so the failure is visible in GTM preview.
      Ensure the Bootstrapper.SST queue via createQueue instead of overwriting the Bootstrapper global.
      Add unit test scenarios, gallery categories, and column headers on the data tables.
      Add an "Event Data Object" field to send an object variable (e.g. an ecommerce object) as the event data, with Event Data rows taking precedence.
      Keep a __timestamp supplied in the event data instead of always overwriting it.
      Align the "Send immediately" and "Publish Path Override" labels and help text with CHEQ Manage.
